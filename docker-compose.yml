services:
  api:
    build:
      context: .
      target: release
    image: trackside-pulse-api:latest
    container_name: trackside-pulse-api
    environment:
      PORT: "8080"
      GIN_MODE: release
    ports:
      # Host-side port is overridable: API_PORT=9090 docker compose up -d
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  # One-shot acceptance service. It waits for the API to become healthy,
  # runs the full contract suite once, and exits 0/1.
  #   docker compose run --rm verify
  # or as part of: docker compose up --build
  verify:
    build:
      context: .
      target: release
    image: trackside-pulse-api:latest
    entrypoint: ["/usr/local/bin/verify", "-base-url", "http://api:8080"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: "no"
